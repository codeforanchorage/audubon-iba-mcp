# OpenContext Configuration
# ==========================
#
# Audubon Important Bird Areas (IBA) MCP — derived from the San Diego City
# GIS fork. Fronts a single fixed ArcGIS FeatureServer, so there is no
# catalog to crawl and no dataset discovery.
#
# IMPORTANT: Enable ONLY ONE plugin per fork/deployment (One Fork = One MCP Server).
# See docs/ARCHITECTURE.md for details.

---
# Server metadata
server_name: "Audubon Important Bird Areas"
description: "National Audubon Society Important Bird Areas (IBA) MCP server - conversational access to the public IBA feature service"
organization: "National Audubon Society"

# Server-level instructions
# ========================
#
# Returned in the MCP `initialize` response, so clients prepend this to the
# model's context once rather than us repeating it in every tool description.
# This is where the interpretive guardrails live — above all, that an IBA is
# a conservation priority, NOT a legal restriction.
instructions: |
  This server exposes the National Audubon Society's public Important Bird
  Areas (IBA) feature service: polygon boundaries for sites identified as
  priorities for bird conservation, plus the related tables behind each site.

  What an IBA is:
  - An IBA is a science-based conservation PRIORITY designation, applied
    against BirdLife International / Audubon criteria. Sites are ranked
    Global, Continental, or State in the `iba_priority` field — that rank is
    the site's conservation significance, nothing more.

  CRITICAL — what an IBA is NOT:
  - IBA designation carries NO legal or regulatory force. It does not protect
    land, restrict its use, encumber title, or trigger any permitting or
    review requirement. Present an IBA as advisory conservation evidence, and
    never as a land-use restriction or a constraint on what an owner may do.
  - The boundaries are advisory, not authoritative property lines. Do not use
    them to determine parcel boundaries, ownership, or jurisdiction.

  How to work the tools:
  - Fetch the main polygon record first (get_iba_details, or search_ibas /
    find_ibas_near_point to locate a site_id). Pull related tables only when
    the question actually needs them:
      species, criteria, criteria_species  -> why the site was designated
      threat, ownership, landuse           -> stewardship context
      habitat                              -> ecosystem composition
      observation                          -> historical survey records
      description                          -> narrative site description
  - Absence of a related record means it was never entered, not that the
    attribute does not apply to the site.

  Chaining to eBird — where silent wrong answers come from:
  - The two datasets share NO keys. `ebird_link` is a human web URL, not an
    API identifier; the `US-CA_202` inside it is an Audubon id that eBird
    tools reject. The working bridge is the site's CENTROID plus the
    `suggested_radius_km` that get_iba_details returns (eBird's 25 km default
    is metro-scale against a site of a few square km). For "inside the IBA"
    rather than "near it", use get_iba_boundary and test hotspot coordinates
    against the polygon.
  - NEVER pass `species_code` to eBird. Audubon's taxonomy is frozen pre-2014
    and most of its codes coincide with eBird's — so a stale one fails
    SILENTLY, returning a plausible "no records" for a species that is really
    present. (Site 202's "Clapper Rail"/`clarai` is eBird's code for an
    Atlantic species; the bird there is Ridgway's Rail, `ridrai1`.) Resolve
    each bird through eBird's taxonomy by scientific name first. Note
    `sci_name` holds only the epithet — the genus is in `iba_genus`.
  - Prefer live eBird data over the `observation` table, which is historical.

  Data use:
  - The endpoint is public, but Audubon routes formal reuse of the spatial
    data through a request process. Flag that for anything beyond ad-hoc
    display or analysis in conversation.

# Plugin configuration
# ====================
#
# IMPORTANT: Enable ONLY ONE plugin below
# For additional MCP servers, fork this repository again
#
plugins:
  # Audubon Important Bird Areas — a single fixed FeatureServer with a known
  # schema. Layer 0 holds the IBA polygons; nine related tables hang off it
  # (species, criteria, habitat, landuse, ownership, threat, observation,
  # site_description) and are reached via queryRelatedRecords.
  #
  # Layer 0's fields, coded-value domains, record cap (2000) and relationship
  # ids are read from the service at runtime — nothing is hardcoded beyond the
  # fields the tools name.
  audubon_iba:
    enabled: true
    service_url: "https://services1.arcgis.com/lDFzr3JyGEn5Eymu/arcgis/rest/services/iba_polygons_public/FeatureServer"
    layer_id: 0 # IBA polygons
    organization: "National Audubon Society"
    timeout: 120
    # token: "${ARCGIS_TOKEN}"  # Not needed: the public IBA service is anonymous
  #
  # The other built-in plugins (ckan, arcgis, socrata, anchorage_gis) are
  # deliberately NOT listed here. This whole file is serialized into the
  # Lambda's OPENCONTEXT_CONFIG env var, and Lambda caps env vars at 4 KB
  # total — disabled stanzas would burn that budget for nothing. See
  # config-example.yaml for their shape.

# AWS deployment settings
aws:
  region: "us-west-2" # AWS region for Lambda
  lambda_name: "audubon-iba-mcp" # Lambda function name
  lambda_memory: 512 # Lambda memory in MB (128-10240)
  lambda_timeout: 120 # Lambda timeout in seconds (max 900)

# Logging configuration
logging:
  level: "INFO" # Log level: DEBUG, INFO, WARNING, ERROR
  format: "json" # Log format: json or text
